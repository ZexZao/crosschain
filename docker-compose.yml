services:
  evm-node:
    image: node:20
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npx hardhat node --hostname 0.0.0.0"
    ports:
      - "8545:8545"

  tee-verifier:
    image: node:20
    working_dir: /app
    environment:
      - TEE_NODE_ID=tee-verifier-1
      - TEE_CLUSTER_THRESHOLD=3
      - TEE_CLUSTER_PEERS=http://tee-verifier-2:9000,http://tee-verifier-3:9000,http://tee-verifier-4:9000,http://tee-verifier-5:9000
      - TEE_RAFT_SHARED_SECRET=${TEE_RAFT_SHARED_SECRET:-local-raft-dev-secret}
      - EVM_RPC=http://evm-node:8545
    volumes:
      - ./:/app
    command: sh -c "node tee-verifier/server.js"
    ports:
      - "9000:9000"
    depends_on:
      - evm-node

  tee-verifier-2:
    image: node:20
    working_dir: /app
    environment:
      - TEE_NODE_ID=tee-verifier-2
      - TEE_CLUSTER_THRESHOLD=3
      - TEE_CLUSTER_PEERS=http://tee-verifier:9000,http://tee-verifier-3:9000,http://tee-verifier-4:9000,http://tee-verifier-5:9000
      - TEE_RAFT_SHARED_SECRET=${TEE_RAFT_SHARED_SECRET:-local-raft-dev-secret}
      - EVM_RPC=http://evm-node:8545
    volumes:
      - ./:/app
    command: sh -c "node tee-verifier/server.js"
    ports:
      - "9001:9000"
    depends_on:
      - evm-node

  tee-verifier-3:
    image: node:20
    working_dir: /app
